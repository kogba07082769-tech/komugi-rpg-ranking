<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background: transparent;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    height: 100vh;
}
#chat {
    display: flex;
    flex-direction: column;
    gap: 0;
    padding: 0;
    margin: 0;
}
.message {
    background: rgba(0,0,0,0.9);
    padding: 5px 10px;
    margin: 0;
    border: none;
    font-size: 28px;
    line-height: 1.3;
}
.username {
    color: #FFD700;
    font-weight: bold;
    font-size: 30px;
}
.text {
    color: white;
    font-size: 28px;
}
</style>
</head>
<body>
<div id="chat"></div>
<script>
const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
ws.onopen = () => {
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan12345');
    ws.send('JOIN #komugi5656');
};
ws.onmessage = (event) => {
    const msg = event.data;
    if (msg.includes('PRIVMSG')) {
        const parts = msg.split(':');
        const userMatch = msg.match(/!(.+?)@/);
        const username = userMatch ? userMatch[1] : 'anonymous';
        const text = parts[2];
        
        if (username === 'komugirpgbot') return;
        if (msg.includes('custom-reward-id')) return;
        if (text.startsWith('!') || text.startsWith('！')) return;
        
        const chatDiv = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.innerHTML = '<span class="username">' + username + '</span> <span class="text">' + text + '</span>';
        chatDiv.appendChild(msgDiv);
        
        while (chatDiv.children.length > 15) {
            chatDiv.removeChild(chatDiv.firstChild);
        }
        
        window.scrollTo(0, document.body.scrollHeight);
    }
    if (msg.includes('PING')) {
        ws.send('PONG :tmi.twitch.tv');
    }
};
</script>
</body>
</html>
