<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>komugi RPGランキング</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans JP', 'Segoe UI', 'Meiryo', sans-serif;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      background: #0a0e27;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(120, 0, 255, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 150, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0a0e27 0%, #1a1f3a 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 1s;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 
        0 0 5px rgba(255,215,0,0.5),
        2px 2px 4px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    .last-update {
      font-size: 0.9rem;
      opacity: 0.8;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .tab {
      background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,0,255,0.1));
      border: 2px solid #ffd700;
      padding: 18px 40px;
      border-radius: 0;
      color: #ffd700;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      text-transform: uppercase;
      position: relative;
      box-shadow: 
        0 0 10px rgba(255,215,0,0.3),
        inset 0 0 10px rgba(255,215,0,0.1);
      clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
    }

    .tab:hover {
      background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,0,255,0.3));
      box-shadow: 
        0 0 20px rgba(255,215,0,0.6),
        inset 0 0 20px rgba(255,215,0,0.2);
      transform: translateY(-3px);
    }

    .tab.active {
      background: linear-gradient(135deg, #ffd700, #ff00ff);
      color: #000;
      font-weight: bold;
      box-shadow: 
        0 0 30px rgba(255,215,0,0.8),
        inset 0 0 20px rgba(255,255,255,0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(255,215,0,0.8); }
      50% { box-shadow: 0 0 50px rgba(255,0,255,0.8); }
    }

    .ranking-card {
      background: linear-gradient(135deg, rgba(20,30,70,0.8), rgba(40,20,60,0.8));
      backdrop-filter: blur(10px);
      border: 3px solid #ffd700;
      border-radius: 0;
      padding: 30px;
      box-shadow: 
        0 0 40px rgba(255,215,0,0.4),
        inset 0 0 30px rgba(255,0,255,0.1);
      position: relative;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    }

    .ranking-card::before {
      content: '⚔️ HALL OF LEGENDS ⚔️';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #000, #1a1f3a, #000);
      padding: 5px 20px;
      border: 2px solid #ffd700;
      font-size: 0.6rem;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
    }

    .ranking-item {
      display: flex;
      align-items: center;
      padding: 20px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, rgba(255,215,0,0.05), rgba(255,0,255,0.05));
      border: 2px solid rgba(255,215,0,0.3);
      border-left: 5px solid #ffd700;
      transition: all 0.3s;
      position: relative;
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 0 100%);
    }

    .ranking-item:hover {
      background: linear-gradient(90deg, rgba(255,215,0,0.15), rgba(255,0,255,0.15));
      border-color: #ffd700;
      transform: translateX(10px) scale(1.02);
      box-shadow:
        0 0 20px rgba(255,215,0,0.5),
        inset 0 0 20px rgba(255,0,255,0.2);
    }

    /* 詳細画面用スタイル */
    .player-name.clickable {
      cursor: pointer;
    }

    .player-name.clickable:hover {
      text-decoration: underline;
    }

    .back-button {
      background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,0,255,0.1));
      border: 2px solid #ffd700;
      padding: 12px 30px;
      border-radius: 0;
      color: #ffd700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(255,215,0,0.3);
      clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
    }

    .back-button:hover {
      background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,0,255,0.3));
      box-shadow: 0 0 20px rgba(255,215,0,0.6);
      transform: translateY(-2px);
    }

    .player-info {
      background: linear-gradient(135deg, rgba(20,30,70,0.8), rgba(40,20,60,0.8));
      border: 2px solid #ffd700;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 0 20px rgba(255,215,0,0.3);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    .player-info h2 {
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    .player-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .stat-item {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border: 1px solid rgba(255,215,0,0.3);
      border-left: 3px solid #ffd700;
    }

    .stat-label {
      color: #aaa;
      font-size: 0.8rem;
    }

    .stat-value {
      color: #ffd700;
      font-size: 1.2rem;
      font-weight: bold;
      text-shadow: 0 0 5px #ffd700;
    }

    .rarity-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
      padding: 20px;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(255,215,0,0.3);
    }

    .rarity-count {
      padding: 10px 20px;
      border: 2px solid;
      font-weight: bold;
      min-width: 80px;
      text-align: center;
      clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
    }

    .rarity-EX {
      border-color: #ffffff;
      color: #ffffff;
      text-shadow: 0 0 10px #ffffff, 0 0 20px #ff00ff, 0 0 30px #00ffff;
      background: linear-gradient(90deg, rgba(255,0,255,0.2), rgba(0,255,255,0.2), rgba(255,215,0,0.2));
    }
    .rarity-GR {
      border-color: #7fff00;
      color: #7fff00;
      text-shadow: 0 0 10px #7fff00;
      background: rgba(127,255,0,0.1);
    }
    .rarity-MR {
      border-color: #ff0000;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      background: rgba(255,0,0,0.1);
    }
    .rarity-LR {
      border-color: #ffd700;
      color: #ffd700;
      text-shadow: 0 0 10px #ffd700;
      background: rgba(255,215,0,0.1);
    }
    .rarity-UR {
      border-color: #ff00ff;
      color: #ff00ff;
      text-shadow: 0 0 10px #ff00ff;
      background: rgba(255,0,255,0.1);
    }
    .rarity-SR {
      border-color: #00ffff;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      background: rgba(0,255,255,0.1);
    }
    .rarity-R {
      border-color: #00ff00;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
      background: rgba(0,255,0,0.1);
    }
    .rarity-N {
      border-color: #888;
      color: #888;
      text-shadow: 0 0 10px #888;
      background: rgba(136,136,136,0.1);
    }

    .bonus-summary {
      margin-bottom: 20px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(20,30,70,0.6), rgba(40,20,60,0.6));
      border: 2px solid #00ffff;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    .bonus-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      margin-bottom: 15px;
      text-align: center;
    }

    .bonus-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .bonus-item {
      background: rgba(0,0,0,0.4);
      padding: 12px 15px;
      border-left: 3px solid #ffd700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bonus-label {
      color: #aaa;
      font-size: 0.9rem;
    }

    .bonus-value {
      color: #ffd700;
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 0 0 5px #ffd700;
    }

    .search-box {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #ffd700;
      color: #fff;
      font-size: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .search-box::placeholder {
      color: #888;
    }

    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .filter-tag {
      background: rgba(255,215,0,0.1);
      border: 2px solid #ffd700;
      padding: 8px 20px;
      color: #ffd700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
      clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
    }

    .filter-tag:hover {
      background: rgba(255,215,0,0.2);
      box-shadow: 0 0 10px rgba(255,215,0,0.5);
    }

    .filter-tag.active {
      background: linear-gradient(135deg, #ffd700, #ff00ff);
      color: #000;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(255,215,0,0.8);
    }

    /* プレイヤー比較機能のスタイル */
    .compare-container {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .compare-selector {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .player-select-box {
      background: linear-gradient(135deg, rgba(20,30,70,0.8), rgba(40,20,60,0.8));
      border: 2px solid #ffd700;
      padding: 20px;
      min-width: 250px;
      text-align: center;
    }

    .player-select-box h3 {
      color: #ffd700;
      margin-bottom: 15px;
      text-shadow: 0 0 10px #ffd700;
    }

    .player-select-box select {
      width: 100%;
      padding: 12px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #00ffff;
      color: #fff;
      font-size: 1rem;
      font-family: 'Noto Sans JP', sans-serif;
      cursor: pointer;
    }

    .player-select-box select option {
      background: #1a1f3a;
      color: #fff;
    }

    .compare-button {
      background: linear-gradient(135deg, #ff0000, #ff6600);
      border: 3px solid #ffd700;
      padding: 15px 50px;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 3px;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(255,0,0,0.5);
      clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
    }

    .compare-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255,0,0,0.8), 0 0 60px rgba(255,215,0,0.5);
    }

    .compare-button:disabled {
      background: linear-gradient(135deg, #444, #666);
      cursor: not-allowed;
      box-shadow: none;
    }

    .vs-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 20px;
      align-items: start;
    }

    .vs-player {
      background: linear-gradient(135deg, rgba(20,30,70,0.9), rgba(40,20,60,0.9));
      border: 3px solid;
      padding: 25px;
      animation: slideIn 0.5s ease-out;
    }

    .vs-player.left {
      border-color: #00ffff;
      box-shadow: 0 0 30px rgba(0,255,255,0.4);
      clip-path: polygon(0 0, 100% 0, 95% 100%, 0 100%);
    }

    .vs-player.right {
      border-color: #ff00ff;
      box-shadow: 0 0 30px rgba(255,0,255,0.4);
      clip-path: polygon(5% 0, 100% 0, 100% 100%, 0 100%);
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .vs-player.right {
      animation-name: slideInRight;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .vs-player-name {
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 2px solid rgba(255,215,0,0.3);
    }

    .vs-player.left .vs-player-name {
      color: #00ffff;
      text-shadow: 0 0 15px #00ffff;
    }

    .vs-player.right .vs-player-name {
      color: #ff00ff;
      text-shadow: 0 0 15px #ff00ff;
    }

    .vs-badge {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 
        0 0 20px #ffd700,
        0 0 40px #ff0000,
        0 0 60px #ff6600;
      animation: vsPulse 1s infinite;
    }

    @keyframes vsPulse {
      0%, 100% { 
        transform: scale(1);
        text-shadow: 0 0 20px #ffd700, 0 0 40px #ff0000;
      }
      50% { 
        transform: scale(1.1);
        text-shadow: 0 0 30px #ffd700, 0 0 60px #ff0000, 0 0 80px #ff6600;
      }
    }

    .vs-stats {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vs-stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-left: 3px solid #ffd700;
    }

    .vs-stat-label {
      color: #aaa;
      font-size: 0.9rem;
    }

    .vs-stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 5px #ffd700;
    }

    .vs-stat-value.winner {
      color: #7fff00;
      text-shadow: 0 0 10px #7fff00;
      animation: winnerGlow 1.5s infinite;
    }

    .vs-stat-value.loser {
      color: #ff4444;
      text-shadow: 0 0 5px #ff4444;
    }

    @keyframes winnerGlow {
      0%, 100% { text-shadow: 0 0 10px #7fff00; }
      50% { text-shadow: 0 0 20px #7fff00, 0 0 30px #00ff00; }
    }

    .compare-bar-container {
      margin-top: 30px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(20,30,70,0.8), rgba(40,20,60,0.8));
      border: 2px solid #ffd700;
    }

    .compare-bar-title {
      text-align: center;
      color: #ffd700;
      font-size: 1.2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ffd700;
    }

    .compare-bar-row {
      margin-bottom: 15px;
    }

    .compare-bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .compare-bar-label span:first-child {
      color: #00ffff;
    }

    .compare-bar-label span:nth-child(2) {
      color: #aaa;
    }

    .compare-bar-label span:last-child {
      color: #ff00ff;
    }

    .compare-bar {
      display: flex;
      height: 25px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,215,0,0.3);
      overflow: hidden;
    }

    .compare-bar-left {
      background: linear-gradient(90deg, #00ffff, #0088ff);
      transition: width 1s ease-out;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #000;
    }

    .compare-bar-right {
      background: linear-gradient(90deg, #ff00ff, #ff0088);
      transition: width 1s ease-out;
      display: flex;
      align-items: center;
      padding-left: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      color: #000;
    }

    .rarity-compare-section {
      margin-top: 30px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(20,30,70,0.8), rgba(40,20,60,0.8));
      border: 2px solid #ffd700;
    }

    .rarity-compare-title {
      text-align: center;
      color: #ffd700;
      font-size: 1.2rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ffd700;
    }

    .rarity-compare-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      align-items: center;
    }

    .rarity-compare-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 15px;
      background: rgba(0,0,0,0.3);
    }

    .rarity-compare-item.left {
      justify-content: flex-end;
    }

    .rarity-compare-item.right {
      justify-content: flex-start;
    }

    .rarity-compare-value {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .rarity-compare-value.winner {
      color: #7fff00;
      text-shadow: 0 0 5px #7fff00;
    }

    .rarity-compare-label {
      padding: 5px 15px;
      border: 2px solid;
      font-weight: bold;
      text-align: center;
      min-width: 60px;
    }

    .winner-banner {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      background: linear-gradient(135deg, rgba(127,255,0,0.2), rgba(255,215,0,0.2));
      border: 3px solid #7fff00;
      animation: winnerBannerPulse 2s infinite;
    }

    @keyframes winnerBannerPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(127,255,0,0.5); }
      50% { box-shadow: 0 0 40px rgba(127,255,0,0.8), 0 0 60px rgba(255,215,0,0.5); }
    }

    .winner-banner h2 {
      font-size: 2rem;
      color: #7fff00;
      text-shadow: 0 0 20px #7fff00;
      margin-bottom: 10px;
    }

    .winner-banner p {
      color: #ffd700;
      font-size: 1.1rem;
    }

    @media (max-width: 768px) {
      .vs-container {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .vs-badge {
        font-size: 2rem;
        padding: 10px;
      }

      .vs-player.left,
      .vs-player.right {
        clip-path: none;
      }

      .compare-selector {
        flex-direction: column;
        align-items: center;
      }

      .player-select-box {
        width: 100%;
        max-width: 300px;
      }
    }

    .items-list {
      display: grid;
      gap: 15px;
    }

    .item-card {
      background: linear-gradient(90deg, rgba(255,215,0,0.05), rgba(255,0,255,0.05));
      border: 2px solid rgba(255,215,0,0.3);
      border-left: 5px solid;
      padding: 15px;
      transition: all 0.3s;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }

    .item-card:hover {
      background: linear-gradient(90deg, rgba(255,215,0,0.15), rgba(255,0,255,0.15));
      transform: translateX(5px);
      box-shadow: 0 0 15px rgba(255,215,0,0.3);
    }

    .skill-header {
      cursor: pointer;
      user-select: none;
    }

    .skill-header:hover {
      opacity: 0.8;
    }

    .accordion-icon {
      display: inline-block;
      margin-right: 8px;
      transition: transform 0.3s;
      font-size: 1.2rem;
    }

    .accordion-icon.open {
      transform: rotate(90deg);
    }

    .owners-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out;
    }

    .owners-list.open {
      max-height: 2000px;
      transition: max-height 0.5s ease-in;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .item-name {
      font-size: 1rem;
      font-weight: bold;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff;
    }

    .item-rarity {
      padding: 5px 15px;
      border: 1px solid;
      font-size: 0.8rem;
      font-weight: bold;
      clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
    }

    .item-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .item-stat {
      background: rgba(0,0,0,0.3);
      padding: 5px 10px;
      border-left: 2px solid #ffd700;
    }

    .rank {
      font-size: 1.8rem;
      font-weight: bold;
      width: 80px;
      text-align: center;
      text-shadow: 0 0 10px currentColor;
    }

    .rank-1 { 
      color: #ffd700;
      animation: rankGlow 2s infinite;
    }
    .rank-2 { 
      color: #c0c0c0;
      text-shadow: 0 0 10px #c0c0c0;
    }
    .rank-3 { 
      color: #cd7f32;
      text-shadow: 0 0 10px #cd7f32;
    }

    @keyframes rankGlow {
      0%, 100% { text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd700; }
      50% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700, 0 0 60px #ff00ff; }
    }

    .player-name {
      flex: 1;
      font-size: 1rem;
      margin-left: 30px;
      color: #00ffff;
      text-shadow: 0 0 5px #00ffff;
      letter-spacing: 2px;
    }

    .value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 
        0 0 10px #ffd700,
        0 0 20px #ff00ff;
      padding: 10px 20px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #ffd700;
      clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
    }

    .loading {
      text-align: center;
      font-size: 1rem;
      padding: 50px;
      color: #00ffff;
      text-shadow: 0 0 10px #00ffff;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }
      .tab {
        font-size: 0.5rem;
        padding: 10px 15px;
      }
      .player-name {
        font-size: 0.7rem;
      }
      .value {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  
  <div class="container">
    <header>
      <h1>🏆 komugi RPG ランキング 🏆</h1>
      <p class="last-update" id="lastUpdate">読み込み中...</p>
    </header>

    <div class="tabs" id="ranking-tabs">
  <button class="tab active" data-tab="prestige">⚡ プレステージ</button>
  <button class="tab" data-tab="attack">⚔️ 最高攻撃力</button>
  <button class="tab" data-tab="damage">💥 最大ダメージ</button>
  <button class="tab" data-tab="skills">✨ スキル数</button>
  <button class="tab" data-tab="skill-owners">📊 スキル所持状況</button>
  <button class="tab" data-tab="compare">🆚 プレイヤー比較</button>
</div>

    <div id="content">
      <div class="loading">データを読み込んでいます...</div>
    </div>
  </div>

  <script>
    // 星を生成
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }

    let rankingData = null;
    let playerData = null;
    let currentTab = 'prestige';
    let currentDetailTab = 'skills';
    let currentFilters = [];
    let currentSkillRarityFilter = '';

    // URLパラメータを取得
    const urlParams = new URLSearchParams(window.location.search);
    const playerName = urlParams.get('player');

    // レアリティの優先順位
    const rarityOrder = { 'EX': 8, 'GR': 7, 'MR': 6, 'LR': 5, 'UR': 4, 'SR': 3, 'R': 2, 'N': 1 };

    async function loadRankings() {
      try {
        const response = await fetch('ranking.json?t=' + Date.now());
        rankingData = await response.json();

        const updateDate = new Date(rankingData.lastUpdate);
        document.getElementById('lastUpdate').textContent =
          `最終更新: ${updateDate.toLocaleString('ja-JP')}`;

        showRanking(currentTab);
      } catch (error) {
        document.getElementById('content').innerHTML =
          '<div class="loading">❌ データの読み込みに失敗しました</div>';
      }
    }

    async function loadPlayerData() {
      try {
        const response = await fetch('players_detail.json?t=' + Date.now());
        const data = await response.json();

        // 最終更新日時を表示
        const updateDate = new Date(data.lastUpdate);
        document.getElementById('lastUpdate').textContent =
          `最終更新: ${updateDate.toLocaleString('ja-JP')}`;

        // プレイヤーデータを設定
        playerData = data.players;
        showPlayerDetail(playerName);
      } catch (error) {
        document.getElementById('content').innerHTML =
          '<div class="loading">❌ プレイヤーデータの読み込みに失敗しました</div>';
      }
    }

    function showRanking(type) {
      currentTab = type;

      // ランキングタブを表示
      document.getElementById('ranking-tabs').style.display = 'flex';

      // スキル所持状況の場合は別の関数を呼び出す
      if (type === 'skill-owners') {
        showSkillOwners();
        return;
      }

      // プレイヤー比較の場合は別の関数を呼び出す
      if (type === 'compare') {
        showCompare();
        return;
      }

      const data = rankingData.rankings[type];

      let html = '<div class="ranking-card">';

      data.forEach((player, index) => {
        const rank = index + 1;
        const rankClass = rank <= 3 ? `rank-${rank}` : '';
        const medal = rank === 1 ? '👑' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '';

        html += `
          <div class="ranking-item">
            <div class="rank ${rankClass}">${medal} ${rank}</div>
            <div class="player-name clickable" onclick="goToPlayerDetail('${player.name}')">${player.name}</div>
            <div class="value">${player.value.toLocaleString()}</div>
          </div>
        `;
      });

      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    async function showSkillOwners() {
      // プレイヤーデータを読み込む（まだ読み込まれていない場合）
      if (!playerData) {
        try {
          const response = await fetch('players_detail.json?t=' + Date.now());
          const data = await response.json();
          playerData = data.players;
        } catch (error) {
          document.getElementById('content').innerHTML =
            '<div class="loading">❌ プレイヤーデータの読み込みに失敗しました</div>';
          return;
        }
      }

      // 各スキルの所持状況を集計
      const skillOwnership = {};
      
      Object.entries(playerData).forEach(([playerName, player]) => {
        if (player.skills && player.skills.length > 0) {
          player.skills.forEach(skill => {
            const key = skill.name;
            if (!skillOwnership[key]) {
              skillOwnership[key] = {
                name: skill.name,
                rarity: skill.rarity,
                effect: skill.effect,
                owners: []
              };
            }
            const count = skill.count || 1;
            skillOwnership[key].owners.push({
              playerName: playerName,
              count: count
            });
          });
        }
      });

      // スキルを配列に変換してソート（レアリティ優先、次に名前）
      const skills = Object.values(skillOwnership);
      skills.sort((a, b) => {
        const rarityDiff = (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0);
        if (rarityDiff !== 0) return rarityDiff;
        return a.name.localeCompare(b.name);
      });

      // レアリティフィルター用のタグを表示
      let html = '<div class="filter-tags" style="margin-bottom: 20px;">';
      html += '<button class="filter-tag' + (currentSkillRarityFilter === '' ? ' active' : '') + '" onclick="filterSkillsByRarity(\'\')">すべて</button>';
      const allRarities = ['EX', 'GR', 'MR', 'LR', 'UR', 'SR', 'R', 'N'];
      allRarities.forEach(rarity => {
        const active = currentSkillRarityFilter === rarity ? 'active' : '';
        const color = getRarityColor(rarity);
        const style = active ? '' : `style="background: rgba(${parseInt(color.slice(1,3), 16)}, ${parseInt(color.slice(3,5), 16)}, ${parseInt(color.slice(5,7), 16)}, 0.1); border-color: ${color}; color: ${color};"`;
        html += `<button class="filter-tag ${active}" ${style} onclick="filterSkillsByRarity('${rarity}')">${rarity}</button>`;
      });
      html += '</div>';

      // フィルター適用
      const filteredSkills = currentSkillRarityFilter 
        ? skills.filter(skill => skill.rarity === currentSkillRarityFilter)
        : skills;

      html += '<div class="ranking-card">';
      html += '<div style="margin-bottom: 20px; color: #00ffff; font-size: 1.1rem; text-align: center;">全スキル: ' + skills.length + '種類 | 表示中: ' + filteredSkills.length + '種類</div>';

      // スキル一覧を表示
      filteredSkills.forEach((skill, index) => {
        const totalCount = skill.owners.reduce((sum, owner) => sum + owner.count, 0);
        const ownerCount = skill.owners.length;
        const skillId = `skill-${index}`;

        html += '<div class="item-card" style="border-left-color: ' + getRarityColor(skill.rarity) + '">';
        
        // クリック可能なヘッダー部分
        html += `<div class="skill-header" onclick="toggleSkillOwners('${skillId}')">`;
        html += '<div class="item-header">';
        html += `<div class="item-name"><span class="accordion-icon" id="icon-${skillId}">▶</span>${skill.name}</div>`;
        html += `<div class="item-rarity rarity-${skill.rarity}" style="border-color: ${getRarityColor(skill.rarity)}; color: ${getRarityColor(skill.rarity)}">${skill.rarity}</div>`;
        html += '</div>';
        
        if (skill.effect) {
          html += `<div style="color: #aaa; font-size: 0.9rem; margin-bottom: 10px;">効果: ${skill.effect}</div>`;
        }

        html += `<div style="color: #ffd700; font-weight: bold; margin-bottom: 10px;">所持者: ${ownerCount}人 | 総数: ${totalCount}個</div>`;
        html += '</div>';

        // アコーディオンで開閉するプレイヤー一覧部分
        html += `<div class="owners-list" id="${skillId}">`;
        html += '<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 10px;">';
        
        // 所持者を所持数の多い順にソート
        skill.owners.sort((a, b) => b.count - a.count);
        
        skill.owners.forEach(owner => {
          html += `<div style="background: rgba(0,0,0,0.3); padding: 8px; border-left: 2px solid #ffd700; display: flex; justify-content: space-between; align-items: center;">`;
          html += `<span class="clickable" style="color: #00ffff; cursor: pointer;" onclick="event.stopPropagation(); goToPlayerDetail('${owner.playerName}')">${owner.playerName}</span>`;
          html += `<span style="color: #ffd700; font-weight: bold;">×${owner.count}</span>`;
          html += '</div>';
        });

        html += '</div>';
        html += '</div>'; // owners-list終了
        html += '</div>'; // item-card終了
      });

      html += '</div>';
      document.getElementById('content').innerHTML = html;
    }

    function goToPlayerDetail(name) {
      window.location.href = `?player=${encodeURIComponent(name)}`;
    }

    function goBack() {
      window.location.href = 'index.html';
    }

    function showPlayerDetail(name) {
      const player = playerData[name];
      if (!player) {
        document.getElementById('content').innerHTML =
          '<div class="loading">❌ プレイヤーが見つかりません</div>';
        return;
      }

      // ランキングタブを非表示
      document.getElementById('ranking-tabs').style.display = 'none';

      // スキルと装備の総数を計算
      const skillsTotal = player.skills.reduce((sum, item) => sum + (item.count || 1), 0);
      const equipmentTotal = player.equipment.reduce((sum, item) => sum + (item.count || 1), 0);

      // スキルからの攻撃力ボーナスを計算
      const skillAttackBonus = player.skills.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.attack > 0 ? item.attack * count : 0);
      }, 0);

      // 装備からの攻撃力ボーナスを計算
      const equipmentAttackBonus = player.equipment.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.attack > 0 ? item.attack * count : 0);
      }, 0);

      // 総合攻撃力を計算
      const totalAttack = player.attack + skillAttackBonus + equipmentAttackBonus;

      let html = `
        <button class="back-button" onclick="goBack()">⬅ ランキングに戻る</button>

        <div class="player-info">
          <h2>${name}</h2>
          <div class="player-stats">
            <div class="stat-item">
              <div class="stat-label">プレステージ</div>
              <div class="stat-value">${player.prestigeCount}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">ドラゴンHP</div>
              <div class="stat-value">${player.dragonHP}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">レベル</div>
              <div class="stat-value">${player.level}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">経験値</div>
              <div class="stat-value">${player.exp}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">基礎攻撃力</div>
              <div class="stat-value">${player.attack}</div>
            </div>
            <div class="stat-item">
              <div class="stat-label">総合攻撃力</div>
              <div class="stat-value">${totalAttack.toLocaleString()}</div>
            </div>
          </div>
        </div>

        <div class="tabs" id="detail-tabs">
          <button class="tab detail-tab ${currentDetailTab === 'skills' ? 'active' : ''}" data-tab="skills" onclick="switchDetailTab('skills')">✨ スキル (${skillsTotal})</button>
          <button class="tab detail-tab ${currentDetailTab === 'equipment' ? 'active' : ''}" data-tab="equipment" onclick="switchDetailTab('equipment')">⚔️ 装備 (${equipmentTotal})</button>
        </div>

        <div id="detail-content"></div>
      `;

      document.getElementById('content').innerHTML = html;
      updateDetailContent(player);
    }

    function switchDetailTab(tab) {
      currentDetailTab = tab;
      currentFilters = [];

      // タブのアクティブ状態を更新
      document.querySelectorAll('.detail-tab').forEach(tabBtn => {
        tabBtn.classList.remove('active');
      });
      document.querySelector(`.detail-tab[data-tab="${tab}"]`).classList.add('active');

      const player = playerData[playerName];
      updateDetailContent(player);
    }

    function updateDetailContent(player) {
      const items = currentDetailTab === 'equipment' ? player.equipment : player.skills;

      // 補正値の合計を計算
      let html = '';
      const bonusTotal = {
        attack: 0,
        critRate: 0,
        expBonus: 0,
        dropRate: 0,
        addAttackRate: 0,
        attackGrowth: 0,
        expCrit: 0
      };

      items.forEach(item => {
        const count = item.count || 1;
        if (item.attack > 0) bonusTotal.attack += item.attack * count;
        if (item.critRate > 0) bonusTotal.critRate += item.critRate * count;
        if (item.expBonus > 0) bonusTotal.expBonus += item.expBonus * count;
        if (item.dropRate > 0) bonusTotal.dropRate += item.dropRate * count;
        if (item.addAttackRate > 0) bonusTotal.addAttackRate += item.addAttackRate * count;
        if (item.attackGrowth > 0) bonusTotal.attackGrowth += item.attackGrowth * count;
        if (item.effect && item.effect.includes('経験値クリティカル')) bonusTotal.expCrit += count;
      });

      // 補正値合計を表示
      html += '<div class="bonus-summary">';
      const bonusTitle = currentDetailTab === 'equipment' ? '⚔️ 装備による補正値合計' : '✨ スキルによる補正値合計';
      html += `<div class="bonus-title">📊 ${bonusTitle}</div>`;
      html += '<div class="bonus-stats">';
      
      if (currentDetailTab === 'skills') {
        if (bonusTotal.attack > 0) html += `<div class="bonus-item"><span class="bonus-label">攻撃:</span> <span class="bonus-value">+${bonusTotal.attack.toLocaleString()}</span></div>`;
        if (bonusTotal.expBonus > 0) html += `<div class="bonus-item"><span class="bonus-label">経験値ボーナス:</span> <span class="bonus-value">+${bonusTotal.expBonus.toLocaleString()}</span></div>`;
        if (bonusTotal.critRate > 0) html += `<div class="bonus-item"><span class="bonus-label">クリティカル率:</span> <span class="bonus-value">+${bonusTotal.critRate.toFixed(2)}%</span></div>`;
        if (bonusTotal.expCrit > 0) html += `<div class="bonus-item"><span class="bonus-label">経験値クリティカル:</span> <span class="bonus-value">+${bonusTotal.expCrit.toFixed(2)}%</span></div>`;
        if (bonusTotal.addAttackRate > 0) html += `<div class="bonus-item"><span class="bonus-label">攻撃追加率:</span> <span class="bonus-value">+${bonusTotal.addAttackRate.toFixed(2)}%</span></div>`;
        if (bonusTotal.dropRate > 0) html += `<div class="bonus-item"><span class="bonus-label">ドロップ率:</span> <span class="bonus-value">+${bonusTotal.dropRate.toFixed(2)}%</span></div>`;
        if (bonusTotal.attackGrowth > 0) html += `<div class="bonus-item"><span class="bonus-label">攻撃成長:</span> <span class="bonus-value">+${bonusTotal.attackGrowth.toLocaleString()}</span></div>`;
      } else {
        if (bonusTotal.attack > 0) html += `<div class="bonus-item"><span class="bonus-label">攻撃:</span> <span class="bonus-value">+${bonusTotal.attack.toLocaleString()}</span></div>`;
        if (bonusTotal.critRate > 0) html += `<div class="bonus-item"><span class="bonus-label">クリティカル率:</span> <span class="bonus-value">+${bonusTotal.critRate.toFixed(2)}%</span></div>`;
        if (bonusTotal.dropRate > 0) html += `<div class="bonus-item"><span class="bonus-label">ドロップ率:</span> <span class="bonus-value">+${bonusTotal.dropRate.toFixed(2)}%</span></div>`;
        if (bonusTotal.addAttackRate > 0) html += `<div class="bonus-item"><span class="bonus-label">攻撃追加率:</span> <span class="bonus-value">+${bonusTotal.addAttackRate.toFixed(2)}%</span></div>`;
      }
      
      html += '</div>';
      html += '</div>';

      // レアリティごとの集計（countプロパティを考慮）
      const rarityCounts = {};
      items.forEach(item => {
        rarityCounts[item.rarity] = (rarityCounts[item.rarity] || 0) + (item.count || 1);
      });

      // 全レアリティを表示（所持数0も含む）
      const allRarities = ['EX', 'GR', 'MR', 'LR', 'UR', 'SR', 'R', 'N'];

      html += '<div class="rarity-summary">';
      allRarities.forEach(rarity => {
        const count = rarityCounts[rarity] || 0;
        html += `<div class="rarity-count rarity-${rarity}">${rarity}: ${count}</div>`;
      });
      html += '</div>';

      // フィルタータグ
      const filterTypes = getFilterTypes(currentDetailTab);
      html += '<div class="filter-tags">';
      filterTypes.forEach(filter => {
        const active = currentFilters.includes(filter.key) ? 'active' : '';
        html += `<button class="filter-tag ${active}" onclick="toggleFilter('${filter.key}')">${filter.label}</button>`;
      });
      html += '</div>';

      // アイテム一覧
      const filteredItems = filterItems(items);
      html += '<div class="items-list">';
      filteredItems.forEach(item => {
        html += renderItemCard(item);
      });
      html += '</div>';

      document.getElementById('detail-content').innerHTML = html;
    }

    function getFilterTypes(tab) {
      if (tab === 'equipment') {
        return [
          { key: 'attack', label: '攻撃' },
          { key: 'critRate', label: 'クリティカル率' },
          { key: 'dropRate', label: 'ドロップ率' },
          { key: 'addAttackRate', label: '攻撃追加率' }
        ];
      } else {
        return [
          { key: 'attack', label: '攻撃' },
          { key: 'expBonus', label: '経験値ボーナス' },
          { key: 'critRate', label: 'クリティカル率' },
          { key: 'expCrit', label: '経験値クリティカル' },
          { key: 'addAttackRate', label: '攻撃追加率' },
          { key: 'dropRate', label: 'ドロップ率' },
          { key: 'attackGrowth', label: '攻撃成長' }
        ];
      }
    }

    function toggleFilter(filterKey) {
      if (currentFilters.includes(filterKey)) {
        currentFilters = [];
      } else {
        currentFilters = [filterKey];
      }
      const player = playerData[playerName];
      updateDetailContent(player);
    }

    function filterItems(items) {
      let filtered = [...items];

      // タグフィルター
      if (currentFilters.length > 0) {
        filtered = filtered.filter(item => {
          return currentFilters.some(filter => {
            if (filter === 'expCrit') {
              return item.effect && item.effect.includes('経験値クリティカル');
            }
            return item[filter] && item[filter] > 0;
          });
        });
      }

      // レアリティ順にソート
      filtered.sort((a, b) => {
        const rarityDiff = (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0);
        if (rarityDiff !== 0) return rarityDiff;
        return a.name.localeCompare(b.name);
      });

      return filtered;
    }

    function renderItemCard(item) {
      let html = `<div class="item-card" style="border-left-color: ${getRarityColor(item.rarity)}">`;
      html += '<div class="item-header">';
      html += `<div class="item-name">${item.name} <span style="color: #ffd700; font-weight: bold;">×${item.count}</span></div>`;
      html += `<div class="item-rarity rarity-${item.rarity}" style="border-color: ${getRarityColor(item.rarity)}; color: ${getRarityColor(item.rarity)}">${item.rarity}</div>`;
      html += '</div>';

      html += '<div class="item-stats">';
      if (item.effect) html += `<div class="item-stat">効果: ${item.effect}</div>`;
      if (item.attack > 0) html += `<div class="item-stat">攻撃: ${item.attack}</div>`;
      if (item.critRate > 0) html += `<div class="item-stat">クリティカル率: ${item.critRate.toFixed(2)}%</div>`;
      if (item.expBonus > 0) html += `<div class="item-stat">経験値: ${item.expBonus}</div>`;
      if (item.dropRate > 0) html += `<div class="item-stat">ドロップ率: ${item.dropRate}%</div>`;
      if (item.addAttackRate > 0) html += `<div class="item-stat">攻撃追加率: ${item.addAttackRate}%</div>`;
      if (item.attackGrowth > 0) html += `<div class="item-stat">攻撃成長: ${item.attackGrowth}</div>`;
      if (item.rate) html += `<div class="item-stat">出現率: ${item.rate}%</div>`;
      html += '</div>';

      html += '</div>';
      return html;
    }

    function filterSkillsByRarity(rarity) {
      currentSkillRarityFilter = rarity;
      showSkillOwners();
    }

    function toggleSkillOwners(skillId) {
      const ownersList = document.getElementById(skillId);
      const icon = document.getElementById('icon-' + skillId);
      
      if (ownersList.classList.contains('open')) {
        ownersList.classList.remove('open');
        icon.classList.remove('open');
        icon.textContent = '▶';
      } else {
        ownersList.classList.add('open');
        icon.classList.add('open');
        icon.textContent = '▼';
      }
    }

    function getRarityColor(rarity) {
      const colors = {
        'EX': '#ffffff',
        'GR': '#7fff00',
        'MR': '#ff0000',
        'LR': '#ffd700',
        'UR': '#ff00ff',
        'SR': '#00ffff',
        'R': '#00ff00',
        'N': '#888'
      };
      return colors[rarity] || '#888';
    }

    // プレイヤー比較機能
    let comparePlayer1 = '';
    let comparePlayer2 = '';
    let compareSortType = 'prestige'; // デフォルトはプレステージ順

    async function showCompare() {
      // プレイヤーデータを読み込む（まだ読み込まれていない場合）
      if (!playerData) {
        try {
          const response = await fetch('players_detail.json?t=' + Date.now());
          const data = await response.json();
          playerData = data.players;
        } catch (error) {
          document.getElementById('content').innerHTML =
            '<div class="loading">❌ プレイヤーデータの読み込みに失敗しました</div>';
          return;
        }
      }

      // ランキングデータを読み込む（まだ読み込まれていない場合）
      if (!rankingData) {
        try {
          const response = await fetch('ranking.json?t=' + Date.now());
          rankingData = await response.json();
        } catch (error) {
          document.getElementById('content').innerHTML =
            '<div class="loading">❌ ランキングデータの読み込みに失敗しました</div>';
          return;
        }
      }

      // プレイヤー名一覧を並び順に応じてソート
      const sortedPlayers = getSortedPlayersForCompare();

      let html = '<div class="compare-container">';
      html += '<div class="ranking-card">';
      html += '<div style="text-align: center; margin-bottom: 20px;">';
      html += '<h2 style="color: #ffd700; text-shadow: 0 0 15px #ffd700; margin-bottom: 10px;">🆚 プレイヤー比較</h2>';
      html += '<p style="color: #aaa;">2人のプレイヤーを選んで、ステータスを比較しよう！</p>';
      html += '</div>';

      // 並び順選択ボタン
      html += '<div style="margin-bottom: 20px;">';
      html += '<div style="text-align: center; color: #aaa; margin-bottom: 10px; font-size: 0.9rem;">プレイヤーリストの並び順</div>';
      html += '<div class="filter-tags" style="justify-content: center;">';
      const sortOptions = [
        { key: 'prestige', label: '⚡ プレステージ' },
        { key: 'attack', label: '⚔️ 最高攻撃力' },
        { key: 'damage', label: '💥 最大ダメージ' },
        { key: 'skills', label: '✨ スキル数' }
      ];
      sortOptions.forEach(opt => {
        const active = compareSortType === opt.key ? 'active' : '';
        html += `<button class="filter-tag ${active}" onclick="changeCompareSortType('${opt.key}')">${opt.label}</button>`;
      });
      html += '</div>';
      html += '</div>';

      html += '<div class="compare-selector">';
      
      // プレイヤー1選択
      html += '<div class="player-select-box">';
      html += '<h3>🔵 プレイヤー1</h3>';
      html += '<select id="compare-player1" onchange="updateComparePlayer(1, this.value)">';
      html += '<option value="">-- 選択してください --</option>';
      sortedPlayers.forEach(p => {
        const selected = comparePlayer1 === p.name ? 'selected' : '';
        html += `<option value="${p.name}" ${selected}>${p.name} (${p.value.toLocaleString()})</option>`;
      });
      html += '</select>';
      html += '</div>';

      // プレイヤー2選択
      html += '<div class="player-select-box">';
      html += '<h3>🟣 プレイヤー2</h3>';
      html += '<select id="compare-player2" onchange="updateComparePlayer(2, this.value)">';
      html += '<option value="">-- 選択してください --</option>';
      sortedPlayers.forEach(p => {
        const selected = comparePlayer2 === p.name ? 'selected' : '';
        html += `<option value="${p.name}" ${selected}>${p.name} (${p.value.toLocaleString()})</option>`;
      });
      html += '</select>';
      html += '</div>';

      html += '</div>';

      // 比較ボタン
      const buttonDisabled = !comparePlayer1 || !comparePlayer2 || comparePlayer1 === comparePlayer2 ? 'disabled' : '';
      html += '<div style="text-align: center; margin: 20px 0;">';
      html += `<button class="compare-button" onclick="executeCompare()" ${buttonDisabled}>⚔️ バトル開始！</button>`;
      html += '</div>';

      html += '</div>'; // ranking-card

      // 比較結果エリア
      html += '<div id="compare-result"></div>';

      html += '</div>'; // compare-container

      document.getElementById('content').innerHTML = html;

      // 既に両方選択されている場合は比較結果を表示
      if (comparePlayer1 && comparePlayer2 && comparePlayer1 !== comparePlayer2) {
        executeCompare();
      }
    }

    function updateComparePlayer(playerNum, value) {
      if (playerNum === 1) {
        comparePlayer1 = value;
      } else {
        comparePlayer2 = value;
      }

      // ボタンの状態を更新
      const button = document.querySelector('.compare-button');
      if (button) {
        button.disabled = !comparePlayer1 || !comparePlayer2 || comparePlayer1 === comparePlayer2;
      }
    }

    function getSortedPlayersForCompare() {
      // ランキングデータから指定された並び順でプレイヤーリストを取得
      const rankings = rankingData.rankings[compareSortType];
      
      if (!rankings) {
        // フォールバック: プレイヤーデータから名前順で返す
        return Object.keys(playerData).map(name => ({
          name: name,
          value: 0
        })).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
      }

      return rankings.map(r => ({
        name: r.name,
        value: r.value
      }));
    }

    function changeCompareSortType(sortType) {
      compareSortType = sortType;
      showCompare();
    }

    function executeCompare() {
      if (!comparePlayer1 || !comparePlayer2 || comparePlayer1 === comparePlayer2) return;

      const p1 = playerData[comparePlayer1];
      const p2 = playerData[comparePlayer2];

      if (!p1 || !p2) return;

      // 各ステータスを計算
      const stats1 = calculatePlayerStats(p1);
      const stats2 = calculatePlayerStats(p2);

      let html = '';

      // VS画面
      html += '<div class="vs-container">';

      // プレイヤー1
      html += '<div class="vs-player left">';
      html += `<div class="vs-player-name">${comparePlayer1}</div>`;
      html += '<div class="vs-stats">';
      html += renderVsStat('プレステージ', stats1.prestige, stats2.prestige);
      html += renderVsStat('レベル', stats1.level, stats2.level);
      html += renderVsStat('基礎攻撃力', stats1.baseAttack, stats2.baseAttack);
      html += renderVsStat('総合攻撃力', stats1.totalAttack, stats2.totalAttack);
      html += renderVsStat('スキル数', stats1.skillCount, stats2.skillCount);
      html += renderVsStat('装備数', stats1.equipmentCount, stats2.equipmentCount);
      html += '</div>';
      html += '</div>';

      // VS
      html += '<div class="vs-badge">VS</div>';

      // プレイヤー2
      html += '<div class="vs-player right">';
      html += `<div class="vs-player-name">${comparePlayer2}</div>`;
      html += '<div class="vs-stats">';
      html += renderVsStat('プレステージ', stats2.prestige, stats1.prestige, true);
      html += renderVsStat('レベル', stats2.level, stats1.level, true);
      html += renderVsStat('基礎攻撃力', stats2.baseAttack, stats1.baseAttack, true);
      html += renderVsStat('総合攻撃力', stats2.totalAttack, stats1.totalAttack, true);
      html += renderVsStat('スキル数', stats2.skillCount, stats1.skillCount, true);
      html += renderVsStat('装備数', stats2.equipmentCount, stats1.equipmentCount, true);
      html += '</div>';
      html += '</div>';

      html += '</div>'; // vs-container

      // バー比較
      html += '<div class="compare-bar-container">';
      html += '<div class="compare-bar-title">📊 ステータス比較</div>';
      html += renderCompareBar('プレステージ', stats1.prestige, stats2.prestige, comparePlayer1, comparePlayer2);
      html += renderCompareBar('総合攻撃力', stats1.totalAttack, stats2.totalAttack, comparePlayer1, comparePlayer2);
      html += renderCompareBar('スキル数', stats1.skillCount, stats2.skillCount, comparePlayer1, comparePlayer2);
      html += renderCompareBar('クリティカル率', stats1.critRate, stats2.critRate, comparePlayer1, comparePlayer2, true);
      html += '</div>';

      // レアリティ別スキル比較
      html += '<div class="rarity-compare-section">';
      html += '<div class="rarity-compare-title">✨ レアリティ別スキル比較</div>';
      html += '<div class="rarity-compare-grid">';
      
      const allRarities = ['EX', 'GR', 'MR', 'LR', 'UR', 'SR', 'R', 'N'];
      allRarities.forEach(rarity => {
        const count1 = stats1.skillsByRarity[rarity] || 0;
        const count2 = stats2.skillsByRarity[rarity] || 0;
        const winner1 = count1 > count2 ? 'winner' : '';
        const winner2 = count2 > count1 ? 'winner' : '';
        
        html += `<div class="rarity-compare-item left"><span class="rarity-compare-value ${winner1}">${count1}</span></div>`;
        html += `<div class="rarity-compare-label rarity-${rarity}" style="border-color: ${getRarityColor(rarity)}; color: ${getRarityColor(rarity)}">${rarity}</div>`;
        html += `<div class="rarity-compare-item right"><span class="rarity-compare-value ${winner2}">${count2}</span></div>`;
      });
      
      html += '</div>';
      html += '</div>';

      // 勝者判定（総合攻撃力ベース）
      const winner = stats1.totalAttack > stats2.totalAttack ? comparePlayer1 : 
                     stats2.totalAttack > stats1.totalAttack ? comparePlayer2 : null;
      
      if (winner) {
        const winnerStats = winner === comparePlayer1 ? stats1 : stats2;
        const loserStats = winner === comparePlayer1 ? stats2 : stats1;
        const diff = winnerStats.totalAttack - loserStats.totalAttack;
        
        html += '<div class="winner-banner">';
        html += `<h2>🏆 ${winner} の勝利！</h2>`;
        html += `<p>総合攻撃力で ${diff.toLocaleString()} ポイントの差をつけました！</p>`;
        html += '</div>';
      } else {
        html += '<div class="winner-banner" style="border-color: #ffd700;">';
        html += '<h2 style="color: #ffd700;">⚔️ 引き分け！</h2>';
        html += '<p>両者の総合攻撃力は同じです！</p>';
        html += '</div>';
      }

      document.getElementById('compare-result').innerHTML = html;
    }

    function calculatePlayerStats(player) {
      const skillsTotal = player.skills.reduce((sum, item) => sum + (item.count || 1), 0);
      const equipmentTotal = player.equipment.reduce((sum, item) => sum + (item.count || 1), 0);

      const skillAttackBonus = player.skills.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.attack > 0 ? item.attack * count : 0);
      }, 0);

      const equipmentAttackBonus = player.equipment.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.attack > 0 ? item.attack * count : 0);
      }, 0);

      const critRate = player.skills.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.critRate > 0 ? item.critRate * count : 0);
      }, 0) + player.equipment.reduce((sum, item) => {
        const count = item.count || 1;
        return sum + (item.critRate > 0 ? item.critRate * count : 0);
      }, 0);

      // レアリティ別スキル数
      const skillsByRarity = {};
      player.skills.forEach(skill => {
        const count = skill.count || 1;
        skillsByRarity[skill.rarity] = (skillsByRarity[skill.rarity] || 0) + count;
      });

      return {
        prestige: player.prestigeCount,
        level: player.level,
        baseAttack: player.attack,
        totalAttack: player.attack + skillAttackBonus + equipmentAttackBonus,
        skillCount: skillsTotal,
        equipmentCount: equipmentTotal,
        critRate: critRate,
        skillsByRarity: skillsByRarity
      };
    }

    function renderVsStat(label, value, otherValue, isRight = false) {
      let winClass = '';
      if (value > otherValue) {
        winClass = 'winner';
      } else if (value < otherValue) {
        winClass = 'loser';
      }

      return `
        <div class="vs-stat-row">
          <span class="vs-stat-label">${label}</span>
          <span class="vs-stat-value ${winClass}">${typeof value === 'number' && !Number.isInteger(value) ? value.toFixed(2) + '%' : value.toLocaleString()}</span>
        </div>
      `;
    }

    function renderCompareBar(label, value1, value2, name1, name2, isPercent = false) {
      const total = value1 + value2;
      const percent1 = total > 0 ? (value1 / total * 100) : 50;
      const percent2 = total > 0 ? (value2 / total * 100) : 50;
      
      const displayValue1 = isPercent ? value1.toFixed(2) + '%' : value1.toLocaleString();
      const displayValue2 = isPercent ? value2.toFixed(2) + '%' : value2.toLocaleString();

      return `
        <div class="compare-bar-row">
          <div class="compare-bar-label">
            <span>${displayValue1}</span>
            <span>${label}</span>
            <span>${displayValue2}</span>
          </div>
          <div class="compare-bar">
            <div class="compare-bar-left" style="width: ${percent1}%">${percent1 > 15 ? displayValue1 : ''}</div>
            <div class="compare-bar-right" style="width: ${percent2}%">${percent2 > 15 ? displayValue2 : ''}</div>
          </div>
        </div>
      `;
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        showRanking(tab.dataset.tab);
      });
    });

    // 初期化
    if (playerName) {
      loadPlayerData();
    } else {
      setInterval(loadRankings, 30000);
      loadRankings();
    }
  </script>
</body>
</html>
